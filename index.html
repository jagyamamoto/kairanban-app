<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a7a3d" />
    <meta name="description" content="町内会の回覧・会館予約・行事のお知らせアプリ" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 共有シートの左に出るサムネイル。指定しないとページ内の画像(地図)が拾われて
         町会と関係ない絵が出てしまうため、町会のアイコンを明示している(オーナー指摘 2026-07-30)。 -->
    <meta property="og:image" content="/icons/icon-192.png" />
    <meta property="og:title" content="町内会アプリ" />
    <meta name="twitter:image" content="/icons/icon-192.png" />
    <!-- ⚠ 表示名は src/shared/org.ts で設定します(ここは読み込み中の一瞬だけ出ます) -->
    <title>町内会アプリ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
